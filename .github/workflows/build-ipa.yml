name: Build IPA
on: 
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create iOS Project
        run: |
          mkdir -p App/App
          # Tìm file html của mày
          if [ -f "index.html" ]; then cp index.html App/App/index.html; fi
          if [ -f "sinhton.html" ]; then cp sinhton.html App/App/index.html; fi
          if [ -f "index_9_fixed_v2.html" ]; then cp index_9_fixed_v2.html App/App/index.html; fi
          ls -la
          ls -la App/App/
          
          cat > App/App/AppDelegate.swift << 'EOF'
          import UIKit
          @main class AppDelegate: UIResponder, UIApplicationDelegate {
            var window: UIWindow?
            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
              window = UIWindow(frame: UIScreen.main.bounds)
              let vc = ViewController()
              window?.rootViewController = vc
              window?.makeKeyAndVisible()
              return true
            }
          }
          EOF

          cat > App/App/ViewController.swift << 'EOF'
          import UIKit
          import WebKit
          class ViewController: UIViewController {
            var webView: WKWebView!
            override func viewDidLoad() {
              super.viewDidLoad()
              let config = WKWebViewConfiguration()
              config.allowsInlineMediaPlayback = true
              config.mediaTypesRequiringUserActionForPlayback = []
              webView = WKWebView(frame: view.bounds, configuration: config)
              webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
              view.addSubview(webView)
              if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
              } else {
                let html = "<h1>Game Survival</h1><p>File index.html not found</p>"
                webView.loadHTMLString(html, baseURL: nil)
              }
            }
          }
          EOF

          cat > App/App/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.duong.survival</string>
          <key>CFBundleName</key><string>Survival</string>
          <key>CFBundleDisplayName</key><string>Survival</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleExecutable</key><string>App</string>
          <key>LSRequiresIPhoneOS</key><true/>
          <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
          <key>NSAppTransportSecurity</key><dict><key>NSAllowsArbitraryLoads</key><true/></dict>
          </dict></plist>
          EOF

          cat > App/project.yml << 'EOF'
          name: App
          targets:
            App:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources: [App]
              info:
                path: App/Info.plist
                properties: {}
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.duong.survival
                  INFOPLIST_FILE: App/Info.plist
                  SWIFT_EMIT_LOC_STRINGS: NO
          EOF

          brew install xcodegen
          cd App && xcodegen generate
          xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Survival.ipa Payload
          ls -lh Survival.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Survival-IPA
          path: App/Survival.ipa
