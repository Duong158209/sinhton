<html lang="vi">
<head><style>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Survivor - Diệt Zombie</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:"Segoe UI",Roboto,Arial,sans-serif;touch-action:none}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none;display:none}
  #hud .row{display:flex;align-items:flex-start;justify-content:space-between}
  #pauseBtn{pointer-events:auto;width:34px;height:34px;border-radius:8px;background:#2b2b3c;border:2px solid #555;display:flex;gap:5px;align-items:center;justify-content:center;cursor:pointer}
  #pauseBtn i{display:block;width:5px;height:15px;background:#fff;border-radius:2px}
  #timer{font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:5px #20202c;paint-order:stroke fill;letter-spacing:1px;margin-top:-2px}
  #stats{text-align:right;color:#fff;font-weight:800;font-size:14px;text-shadow:0 0 3px #000,0 0 3px #000;line-height:20px;min-width:70px}
  #stats b{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px;margin-right:4px}
  .coin{background:#ffc928;border:2px solid #c28a00}
  .skull{background:#ddd;border:2px solid #888;border-radius:6px 6px 4px 4px!important}
  #xpWrap{position:relative;margin-top:4px;height:18px;background:#1c1c28;border:2px solid #0d0d14;border-radius:4px;overflow:hidden}
  #xpBar{height:100%;width:0;background:linear-gradient(#9dff35,#56c910)}
  #lvl{position:absolute;left:4px;top:0;font-size:11px;font-weight:900;color:#fff;line-height:14px;text-shadow:0 0 3px #000}
  .ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(10,10,20,.72);z-index:5;padding:16px}
  .btn{pointer-events:auto;cursor:pointer;background:linear-gradient(#ffb731,#ff8a00);color:#4a2400;font-weight:900;font-size:20px;padding:12px 34px;border-radius:10px;border:3px solid #fff3;box-shadow:0 4px 0 #a85600;margin:6px}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a85600}
  .btn.sec{background:linear-gradient(#6e7aa8,#4a5580);color:#fff;box-shadow:0 4px 0 #2b3358}
  h1{color:#ffd23a;font-size:42px;margin:0 0 4px;text-shadow:0 4px 0 #8a4b00;text-align:center}
  p.sub{color:#cfd3ee;margin:0 0 20px;text-align:center;font-size:14px;max-width:320px;line-height:1.5}
  .banner{background:linear-gradient(#ffd23a,#ff9f00);color:#5a2c00;font-weight:900;font-size:22px;padding:8px 40px;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);margin-bottom:18px}
  #cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:560px}
  .card{width:108px;min-height:190px;background:linear-gradient(#34344a,#22222f);border:3px solid #555a7a;border-top:0;border-radius:6px;cursor:pointer;text-align:center;color:#fff;overflow:hidden;transition:transform .1s}
  .card:hover{transform:translateY(-4px)}
  .card .hd{background:#d9a21b;color:#3a2100;font-size:12px;font-weight:900;padding:5px 2px}
  .card .ic{font-size:40px;margin:12px 0 6px}
  .card .ds{font-size:11.5px;color:#c9cde4;padding:0 6px 6px;line-height:1.35}
  .card .st{color:#ffc928;font-size:15px;letter-spacing:1px}
  .card .new{display:inline-block;background:#3ecb2f;color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:4px;margin-bottom:2px}
  .card.evo{border-color:#b86bff;box-shadow:0 0 16px #b86bffaa;background:linear-gradient(#3b2a5e,#241a3a)}
  .card.evo .hd{background:linear-gradient(#c58bff,#8a3df0);color:#fff}
  .card .new.u{background:#a63df0}
  #slots{display:flex;gap:4px;margin-bottom:14px;justify-content:center}
  #slots span{width:30px;height:30px;background:#262636;border:2px solid #4b4b66;border-radius:5px;font-size:17px;line-height:26px;text-align:center}
  .res{color:#fff;font-size:16px;margin:2px 0;font-weight:700}
</style>

<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="row">
    <div id="pauseBtn"><i></i><i></i></div>
    <div id="timer">00:00</div>
    <div id="stats"><div><b class="coin"></b><span id="coins">0</span></div><div><b class="skull"></b><span id="kills">0</span></div></div>
  </div>
  <div id="xpWrap"><div id="xpBar"></div><div id="lvl">LV.1</div></div>
</div>

<div class="ov" id="menu" style="display:flex">
  <h1>SURVIVOR</h1>
  <p class="sub">Kéo ngón tay (hoặc WASD / phím mũi tên) để di chuyển. Vũ khí tự động tấn công. Nhặt ngọc xanh để lên cấp và chọn kỹ năng, sống sót càng lâu càng tốt!</p>
  <div class="btn" id="startBtn">Bắt đầu</div>
</div>

<div class="ov" id="levelup">
  <div class="banner">Chọn kỹ năng</div>
  <div id="slots"></div>
  <div id="cards"></div>
</div>

<div class="ov" id="pause">
  <h1 style="font-size:34px">Tạm dừng</h1>
  <div class="btn" id="resumeBtn">Tiếp tục</div>
  <div class="btn sec" id="restartBtn1">Chơi lại</div>
</div>

<div class="ov" id="over">
  <h1 style="color:#ff5a5a;text-shadow:0 4px 0 #6d1010">THẤT BẠI</h1>
  <div class="res" id="rTime"></div>
  <div class="res" id="rKills"></div>
  <div class="res" id="rLvl"></div>
  <div class="res" id="rCoins" style="margin-bottom:16px"></div>
  <div class="btn" id="restartBtn2">Chơi lại</div>
</div>

<script>
(()=>{

"use strict";
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const golemImg=new Image(); golemImg.src=''; // removed large image to fix freeze - use procedural
let golemAttackFx=0, golemRootFx=0;
function golemExtraDmg(e){ return (lv.golem>=6 ? e.max*0.03 : 0); } // giảm từ 5% xuống 3% theo yêu cầu
let W=0,H=0,dpr=1,zoom=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  zoom=Math.min(W/390,H/680);
  if(zoom<0.7)zoom=0.7;
}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const SK={
  kunai:{n:'Dao găm Kunai',ic:'🗡️',type:'w',d:'Phóng kunai vào kẻ địch gần nhất. Mỗi cấp thêm dao hoặc sát thương.'},
  rocket:{n:'Tên lửa',ic:'🚀',type:'w',d:'Bắn tên lửa tự dẫn, nổ lan gây sát thương diện rộng.'},
  lightning:{n:'Sấm sét',ic:'⚡',type:'w',d:'Giáng sét từ trên trời xuống kẻ địch ngẫu nhiên.'},
  boomerang:{n:'Boomerang',ic:'🪃',type:'w',d:'Ném boomerang bay đi rồi quay lại, xuyên mọi kẻ địch.'},
  ringz:{n:'Vòng Sét',ic:'⭕',type:'w',d:'Phóng vòng tròn sét từ nhân vật ra ngoài gây sát thương rồi thu lại.'},
  drone:{n:'Drone Súng',ic:'🛸',type:'w',d:'Triệu hồi drone tự động bắn quái. Mỗi cấp bắn nhanh hơn và mạnh hơn.'},
  golem:{n:'Golem Cây',ic:'🌳',type:'w',d:'Triệu hồi Golem Cây bất tử 60s, đánh lan >100 dame, tăng 5% dame mỗi lần gọi. Có rễ trói và đất lăn.'},
  tuocdoat:{n:'Kẻ Tước Đoạt',ic:'☠️',type:'w',d:'Khi địch dưới 20% máu có 5% kết liễu ngay. 5★: 15%. Ultimate: mỗi 10s bắt 1 quái ngẫu nhiên (kể cả boss) gây dame tử thần.'},
  hoden:{n:'Hố Đen Vũ Trụ',ic:'🕳️',type:'w',d:'Triệu hồi hố đen hút quái vào tâm, gây dame liên tục. Cấp cao tăng bán kính và dame. Không gây dame lên người chơi.'},
  hp:{n:'Trái tim',ic:'❤️',type:'p',d:'Tăng 20% máu tối đa và hồi một ít máu.'},
  spd:{n:'Giày chạy',ic:'👟',type:'p',d:'Tăng 8% tốc độ di chuyển.'},
  mag:{n:'Nam châm',ic:'🧲',type:'p',d:'Tăng phạm vi hút ngọc kinh nghiệm.'},
  dmg:{n:'Găng sức mạnh',ic:'💪',type:'p',d:'Tăng 15% sát thương mọi vũ khí.'},
  ls:{n:'Hút máu',ic:'🩸',type:'p',d:'Hồi máu bằng một phần sát thương gây ra.'},
  xp:{n:'Kinh nghiệm',ic:'📘',type:'p',d:'Nhận thêm kinh nghiệm từ ngọc.'},
  heal30:{n:'Hồi 30% máu',ic:'💊',type:'h',d:'Hồi ngay 30% máu tối đa.'},
  healfull:{n:'Hồi đầy máu',ic:'💖',type:'h',d:'Hồi đầy toàn bộ máu.'}
};
const MAXLV=5;
const LS=[0,.01,.02,.03,.03,.03],LS_TXT=[1,2,3,3,3];
const EVO={
  kunai:{n:'Vòng Kunai Bất Tận',ic:'🌪️',d:'TIẾN HÓA: liên tục phóng vòng 32 kunai ra ngoài rồi thu về ngay lập tức, sát thương x4.'},
  rocket:{n:'Mưa Tên Lửa',ic:'☄️',d:'TIẾN HÓA: mỗi 4s gọi mưa 5 tên lửa khổng lồ từ trên trời rơi xuống, nổ cực lớn, sát thương 700.'},
  lightning:{n:'Mây Bão Khổng Lồ',ic:'🌩️',d:'TIẾN HÓA: triệu hồi 4 đám mây khổng lồ sống 10s, giật lan 10 mục tiêu, sát thương x2. Mây tan 2.5s sau sẽ triệu hồi đợt mới.'},
  boomerang:{n:'Boomerang Bão Tố',ic:'💫',d:'TIẾN HÓA: 3 boomerang khổng lồ nảy liên tục giữa 15 mục tiêu, sát thương x3.'},
  ringz:{n:'Vòng Điện Hấp Huyết',ic:'🔮',d:'TIẾN HÓA: vòng điện tím bao quanh người, quái chạm vào bị giật liên tục (sát thương x2.5) và hút 0.5% máu mỗi con.'},
  drone:{n:'Drone Laser 4 Hướng',ic:'💥',d:'TIẾN HÓA: drone bắn 4 tia laser cùng lúc, sát thương x3, tốc độ x2. Bắn 10s nghỉ 2.5s.'},
  golem:{n:'Golem Cổ Thụ Ultimate',ic:'🌲',d:'TIẾN HÓA: Golem tóc xanh, mắt đỏ, to hơn, dame +80%, rễ trói rộng hơn, đất lăn to hơn và tồn tại 75s.'},
  hoden:{n:'Hố Đen Nuốt Chửng',ic:'🌌',d:'TIẾN HÓA: Hố đen to gấp đôi, hút mạnh hơn, gây thêm 3% máu tối đa của địch mỗi tick, tồn tại 6.5s. Khi nổ gây 300% tổng dame + 3% máu. Không gây dame lên người chơi.'},
  tuocdoat:{n:'Tước Đoạt Vĩnh Hằng',ic:'👁️',d:'TIẾN HÓA: Mỗi 10s triệu hồi Trảo Tử Thần bắt 1 quái ngẫu nhiên (boss vẫn tính), gây dame tử thần - dính là chết luôn kể cả bot. Vẫn giữ 15% kết liễu khi địch dưới 20% máu.'}
};
const wmax=k=>SK[k].type==='w'&&EVO[k]?6:MAXLV;
const icon=k=>(lv[k]>=6&&EVO[k])?EVO[k].ic:SK[k].ic;
let state='menu';
let P,enemies,gems,coinsArr,projs,fx,texts,bolts,rings,clouds,arcs,warns,eprojs,bossIdx,lastBossHp,lastBossDmg,blackholes,droneSt,golemSt,chests;
let T,kills,coins,spawnAcc,burstT,shake,bossT,kr,auraT,firstPick,bonusPicks,magnets,magnetT,monsterScale,monsterHpScale,monsterDmgScale,lastScaleT,frenzyNext,frenzyActive,frenzyT,frenzyDuration,frenzyCount;
const AURA_R=150;
let lv={},ps={};
function reset(){
  P={x:0,y:0,hp:250,maxhp:250,lvl:1,xp:0,face:1,hurt:0,anim:0,moving:false};
  enemies=[];gems=[];coinsArr=[];projs=[];fx=[];texts=[];bolts=[];rings=[];clouds=[];arcs=[];warns=[];eprojs=[];bossIdx=0;lastBossHp=1500;lastBossDmg=90;blackholes=[];chests=[];
  T=0;kills=0;coins=0;spawnAcc=0;burstT=30;shake=0;bossT=90;kr={t:0,rad:24,out:true,off:0};auraT=0;firstPick=true;bonusPicks=0;magnets=[];magnetT=25;monsterScale=1;monsterHpScale=1;monsterDmgScale=1;lastScaleT=150;frenzyNext=150;frenzyActive=false;frenzyT=0;frenzyDuration=25;frenzyCount=0;
  lv={kunai:1};ps={hp:0,spd:0,mag:0,dmg:0,ls:0,xp:0};
  cd={kunai:0,rocket:0,lightning:0,boomerang:0,ringz:0,drone:0,golem:0,tuocdoat:0,hoden:0};
  droneSt={ang:0,active:10,rest:0,firing:true,orbit:48};
  golemSt={active:false,x:0,y:0,life:0,cd:0,atk:0,combo:0,rootCd:5,earthCd:8,summons:0,walk:0,moving:false};
  golemAttackFx=0; golemRootFx=0;
  updateHud();
}
let cd={};
const need=l=>Math.floor(6 + l*3.5 + l*l*0.85);
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape'||e.key==='p')togglePause();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const joy={active:false,id:null,bx:0,by:0,kx:0,ky:0,dx:0,dy:0,R:52};
function joyDefault(){joy.bx=W/2;joy.by=H-110-(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab'))||0);}
function joyPos(e){return [e.clientX,e.clientY];}
cv.addEventListener('pointerdown',e=>{
  if(state!=='play'||joy.active)return;
  joy.active=true;joy.id=e.pointerId;
  [joy.bx,joy.by]=joyPos(e);joy.kx=joy.bx;joy.ky=joy.by;joy.dx=joy.dy=0;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!joy.active||e.pointerId!==joy.id)return;
  let [x,y]=joyPos(e);let dx=x-joy.bx,dy=y-joy.by;const d=Math.hypot(dx,dy);
  if(d>joy.R){dx=dx/d*joy.R;dy=dy/d*joy.R;}
  joy.kx=joy.bx+dx;joy.ky=joy.by+dy;
  joy.dx=dx/joy.R;joy.dy=dy/joy.R;
});
function joyEnd(e){
  if(!joy.active||e.pointerId!==joy.id)return;
  joy.active=false;joy.id=null;joy.dx=joy.dy=0;
  cv.releasePointerCapture(e.pointerId);
}
cv.addEventListener('pointerup',joyEnd);
cv.addEventListener('pointercancel',joyEnd);
function updateHud(){
  const xpP=P.xp/need(P.lvl)*100;
  $('xpBar').style.width=Math.min(100,xpP)+'%';
  $('lvl').textContent='LV.'+P.lvl;
  $('coins').textContent=coins;
  $('kills').textContent=kills;
  $('timer').textContent=fmt(T);
}
function show(id,on){$(id).style.display=on?'flex':'none';}
function startGame(){
  reset();state='play';
  show('menu',false);show('over',false);show('pause',false);show('levelup',false);
  $('hud').style.display='block';joyDefault();
}
function togglePause(){
  if(state==='play'){state='pause';show('pause',true);}
  else if(state==='pause'){state='play';show('pause',false);}
}
$('startBtn').onclick=startGame;
$('restartBtn1').onclick=startGame;
$('restartBtn2').onclick=startGame;
$('resumeBtn').onclick=togglePause;
$('pauseBtn').onclick=togglePause;
function stars(n){return '★'.repeat(n)+'<span style="color:#555">'+'★'.repeat(MAXLV-n)+'</span>';}
function openLevelUp(){
  state='levelup';
  joy.active=false;joy.dx=joy.dy=0;
  const pool=[];
  for(const k in SK){
    if(SK[k].type==='h'){pool.push(k);continue;}
    const cur=SK[k].type==='w'?(lv[k]||0):ps[k];
    if(cur<wmax(k))pool.push(k);
  }
  const wc=Object.keys(lv).length;
  const opts=pool.filter(k=>!(SK[k].type==='w'&&!lv[k]&&wc>=6));
  opts.sort(()=>Math.random()-.5);
  let pick;
  if(firstPick){
    firstPick=false;
    const wo=opts.filter(k=>SK[k].type==='w'),po=opts.filter(k=>SK[k].type==='p');
    pick=[...wo.slice(0,2),...po.slice(0,1)];
  }else{
    pick=opts.slice(0,3);
  }
  if(pick.length===0){show('levelup',false);state='play';return;}
  const cont=$('cards');cont.innerHTML='';
  const slots=$('slots');slots.innerHTML='';
  for(const k in lv){const s=document.createElement('span');s.textContent=icon(k);slots.appendChild(s);}
  for(const k in ps){if(ps[k]>0){const s=document.createElement('span');s.textContent=SK[k].ic;slots.appendChild(s);}}
  for(const k of pick){
    const s=SK[k];
    const isEvo=lv[k]===5&&EVO[k];
    const cur=isEvo?EVO[k]:s;
    const nxt=isEvo?6:(s.type==='w'?(lv[k]||0)+1:ps[k]+1);
    const el=document.createElement('div');
    el.className='card'+(isEvo?' evo':'');
    el.innerHTML=`<div class="hd">${cur.n}</div><div class="ic">${cur.ic}</div><div class="ds">${cur.d}</div><div class="st">${s.type==='h'?'':stars(Math.min(nxt,5))}</div>${lv[k]?`<div class="new">Lv.${lv[k]}</div>`:isEvo?`<div class="new u">TIẾN HÓA</div>`:`<div class="new">MỚI</div>`}`;
    el.onclick=()=>{
      if(s.type==='w'){lv[k]=(lv[k]||0)+1;if(lv[k]===6&&EVO[k])ultFlash(k);}
      else if(s.type==='h'){const before=P.hp;P.hp=k==='healfull'?P.maxhp:Math.min(P.maxhp,P.hp+P.maxhp*.3);texts.push({x:P.x,y:P.y-24,v:'+'+Math.round(P.hp-before),t:1,heal:true,c:true});}
      else{ps[k]++;if(k==='hp'){const old=P.maxhp;P.maxhp=250*(1+.2*ps.hp);P.hp+=P.maxhp-old+10;P.hp=Math.min(P.hp,P.maxhp);}}
      show('levelup',false);state='play';
      if(bonusPicks>0){
        bonusPicks--;
        if(bonusPicks>0){
          setTimeout(()=>{ if(state==='play') openLevelUp(); }, 120);
        }
      }
      if(P.xp>=need(P.lvl)){levelCheck();}
    };
    cont.appendChild(el);
  }
  show('levelup',true);
}
function ultFlash(k){
  texts.push({x:P.x,y:P.y-60,v:EVO[k].n+'!',t:2,c:true,big:true});

const maxEnemies=()=>Math.min(520,260+Math.floor(T/20)*10);
function spawnEnemy(forceType,px,py){
  if(enemies.length>=maxEnemies()&&forceType!=='b')return;
  const a=rnd(0,Math.PI*2),r=Math.max(W,H)/zoom/2*1.05+30;
  let type=forceType||'n';
  if(!forceType){
    const roll=Math.random();
    if(T>25&&roll>.8)type='r';
    else if(T>40&&roll<0.18)type='f';
    else if(T>80&&roll<0.28)type='t';
  }
  const scaleBase=(1+T/45),mmBase=Math.pow(1.10,Math.floor(T/90));
  const scale=scaleBase*monsterHpScale,mmHp=mmBase*monsterHpScale,mmDmg=mmBase*monsterDmgScale;
  const mm=mmDmg; // dmg dùng mmDmg, hp dùng scale*mmHp nhưng để đơn giản dùng tuyến tính
  // tính lại hp theo hpScale, dame theo dmgScale (tuyến tính)
  
  let e={x:P.x+Math.cos(a)*r,y:P.y+Math.sin(a)*r,t:type,ph:Math.random()*6,kx:0,ky:0,flash:0};
  if(type==='n'){const fH=frenzyActive?4:1, fD=frenzyActive?2.5:1; e.hp=16*scaleBase*mmBase*monsterHpScale*fH;e.sp=rnd(38,50);e.r=9;e.dmg=10*mmDmg*fD;e.s=1;}
  if(type==='f'){const fH=frenzyActive?4:1, fD=frenzyActive?2.5:1; e.hp=10*scaleBase*mmBase*monsterHpScale*fH;e.sp=rnd(72,86);e.r=8;e.dmg=8*mmDmg*fD;e.s=.9;}
  if(type==='r'){const fH=frenzyActive?4:1, fD=frenzyActive?2.5:1; e.hp=12*scaleBase*mmBase*monsterHpScale*fH;e.sp=44;e.r=8;e.dmg=4.5*mmDmg*fD;e.s=.95;e.sh=rnd(1,4);}
  if(type==='t'){const fH=frenzyActive?4:1, fD=frenzyActive?2.5:1; e.hp=70*scaleBase*mmBase*monsterHpScale*fH;e.sp=rnd(28,34);e.r=14;e.dmg=18*mmDmg*fD;e.s=1.5;}
  if(type==='sk'){const fH=frenzyActive?4:1, fD=frenzyActive?2.5:1; e.hp=160*scaleBase*mmBase*monsterHpScale*fH;e.sp=rnd(32,40);e.r=10;e.dmg=50*mmDmg*fD;e.s=1.2;e.isSkel=true;e.revived=false;}
  if(type==='b'){
    e.bt=bossIdx%2?'r':'m';
    if(bossIdx===0){
      e.hp=1500;
      e.dmg=90;
    }else{
      e.hp=lastBossHp*3;
      e.dmg=lastBossDmg*1.5;
    }
    lastBossHp=e.hp;
    lastBossDmg=e.dmg;
    e.sp=e.bt==='r'?68:72;e.r=e.bt==='r'?26:28;e.s=e.bt==='r'?2.5:2.7;bossIdx++;
  }
  e.max=e.hp;
  if(px!==undefined){e.x=px;e.y=py;}
  if(type==='b'){e.s1=4;e.s2=8;e.s3=6;e.s4=9;e.cw=0;e.dash=0;e.dx=0;e.dy=0;
    if(e.bt==='r'){e.s1=1.5;e.s2=4;e.s3=8;e.s4=6;e.s5=9;}}
  enemies.push(e);
}
function bossAI(e,dt){
  if(e.bt==='r'){
    e.s1-=dt;e.s2-=dt;e.s3-=dt;
    const base=Math.atan2(P.y-e.y,P.x-e.x);
    if(e.s1<=0){e.s1=2.4;
      for(let i=-2;i<=2;i++){const a=base+i*.2;
        eprojs.push({x:e.x,y:e.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,dmg:e.dmg*.675,life:3.5,r:11,c:'boss',redOrb:true});}}
    if(e.s2<=0){e.s2=6;const off=rnd(0,6.28);
      for(let i=0;i<16;i++){const a=off+i*Math.PI/8;
        eprojs.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,dmg:e.dmg*.525,life:4,r:8,c:'boss'});}}
    if(e.s3<=0){e.s3=10;
      for(let i=0;i<20;i++){const a=i*Math.PI/10+rnd(-0.2,0.2);
        spawnEnemy('sk',e.x+Math.cos(a)*(60+rnd(0,30)),e.y+Math.sin(a)*(60+rnd(0,30)));}
      texts.push({x:e.x,y:e.y-60,v:'Triệu hồi 20 bộ xương!',t:1.4,c:true,big:true});
      e.s3=18;
    }
    e.s4-=dt;e.s5-=dt;
    if(e.s4<=0){
      e.s4=7;
      for(let i=0;i<6;i++){const a=rnd(0,6.28),r=i?rnd(20,120):0;
        warns.push({x:P.x+Math.cos(a)*r,y:P.y+Math.sin(a)*r,r:72,t:1.3,T:1.3,dmg:e.dmg*1.8,cap:.35,isMeteor:true});}
      texts.push({x:e.x,y:e.y-60,v:'Mưa thiên thạch!',t:1.2,c:true});
    }
    if(e.s5<=0){
      e.s5=9;
      fx.push({x:e.x,y:e.y,ring:60,t:.3,T:.3,c:'#b24bff'});
      const a=rnd(0,6.28);e.x=P.x+Math.cos(a)*260;e.y=P.y+Math.sin(a)*260;
      fx.push({x:e.x,y:e.y,ring:60,t:.3,T:.3,c:'#b24bff'});
    }
    return;
  }
  if(e.cw>0){e.cw-=dt;if(e.cw<=0){e.dash=.65; e.dashDmg=true;} return;}
  if(e.dash>0){
    e.dash-=dt;
    if(e.dashDmg){
      const d=Math.hypot(P.x-e.x,P.y-e.y);
      if(d < (e.r+18)*2.5){
        P.hp-=Math.min(e.dmg*1.35, P.maxhp*0.8);
        P.hurt=0.35; P.inv=0.3; shake=8;
        fx.push({x:P.x,y:P.y,ring:50,t:.3,T:.3,c:'#ff2222'});
        texts.push({x:P.x,y:P.y-20,v:'-LƯỚT CHÉM!',t:0.8,c:true});
      }
    }
    if(Math.random()<0.5) fx.push({x:e.x,y:e.y,vx:rnd(-20,20),vy:rnd(-20,20),t:.3,c:'#ff4422',r:4});
    return;
  }
  e.s1-=dt;e.s2-=dt;e.s3-=dt;e.s4-=dt;
  if(e.s4<=0){
    e.s4=13;
    warns.push({x:e.x,y:e.y,r:280,t:1.8,T:1.8,dmg:e.dmg*3.3,cap:.65,isMeteor:true});
    texts.push({x:e.x,y:e.y-60,v:'ĐẬP HỦY DIỆT!',t:1.3,c:true,big:true});
  }
  if(!e.enr&&e.hp<e.max*.5){
    e.enr=true;e.sp*=1.35;
    for(let i=0;i<10;i++){const a=i*Math.PI/5;spawnEnemy('n',e.x+Math.cos(a)*60,e.y+Math.sin(a)*60);}
    texts.push({x:e.x,y:e.y-60,v:'NỔI ĐIÊN!',t:1.4,c:true,big:true});
  }
  if(e.s1<=0){
    e.s1=6;
    warns.push({x:e.x,y:e.y,r:160,t:0.9,T:0.9,dmg:e.dmg*2.1,cap:.55,isMeteor:true});
    texts.push({x:e.x,y:e.y-50,v:'CHÉM!',t:0.8,c:true});
  }
  if(e.s2<=0){
    e.s2=10;
    for(let i=0;i<8;i++){const a=i*Math.PI/4;spawnEnemy('n',e.x+Math.cos(a)*55,e.y+Math.sin(a)*55);}
    texts.push({x:e.x,y:e.y-60,v:'Triệu hồi!',t:1,c:true});
  }
  if(e.s3<=0){
    e.s3=7;e.cw=.8;
    const d=Math.hypot(P.x-e.x,P.y-e.y)||1;e.dx=(P.x-e.x)/d;e.dy=(P.y-e.y)/d;
  }
}
function hitEnemy(e,dmg,kx,ky,crit,fromTuoc){
  dmg*=1+.15*ps.dmg;
  if(Math.random()<.1){dmg*=2;crit=true;}
  if(ps.ls)P.hp=Math.min(P.maxhp,P.hp+Math.min(dmg,Math.max(e.hp,0))*LS[ps.ls]);
  e.hp-=dmg;e.flash=.1;
  const d=Math.hypot(kx,ky)||1;const kb=e.t==='b'?.06:1;e.kx+=kx/d*90*kb;e.ky+=ky/d*90*kb;
  texts.push({x:e.x+rnd(-6,6),y:e.y-14,v:Math.round(dmg),t:.6,c:crit});
  for(let i=0;i<2;i++)fx.push({x:e.x,y:e.y,vx:rnd(-60,60),vy:rnd(-60,60),t:.25,c:'#9fe04a',r:2});
  // --- Kẻ Tước Đoạt: kết liễu khi dưới 20% máu ---
  if(!fromTuoc && lv.tuocdoat && !e.dead && e.hp>0 && e.hp <= e.max*0.2){
    const chance = lv.tuocdoat>=5 ? 0.15 : 0.05;
    if(Math.random() < chance){
      // kết liễu ngay
      e.hp=0;
      e.flash=0.4;
      texts.push({x:e.x,y:e.y-28,v:'TƯỚC ĐOẠT!',t:1.2,c:true,big:true});
      fx.push({x:e.x,y:e.y,ring:45,t:.5,T:.5,c:'#000000'});
      fx.push({x:e.x,y:e.y,ring:30,t:.4,T:.4,c:'#ff0000'});
      for(let i=0;i<8;i++) fx.push({x:e.x,y:e.y,vx:rnd(-120,120),vy:rnd(-120,120),t:.5,c:'#111',r:rnd(2,5)});
    }
  }
  if(e.hp<=0&&!e.dead){
    if(e.isSkel && !e.revived){
      e.revived=true;
      e.hp=e.max*0.6;
      e.flash=0.5;
      fx.push({x:e.x,y:e.y,ring:30,t:.5,T:.5,c:'#aaffff'});
      texts.push({x:e.x,y:e.y-20,v:'Hồi sinh!',t:1,c:true});
      for(let i=0;i<6;i++) fx.push({x:e.x,y:e.y,vx:rnd(-70,70),vy:rnd(-70,70),t:.4,c:'#ddffdd',r:3});
      return;
    }
    e.dead=true;kills++;
    gems.push({x:e.x,y:e.y,v:(e.t==='b'?50:e.t==='t'?4:1)*(T<90?3:1),m:false});
    if(e.t==='b'){
      for(let i=0;i<12;i++)coinsArr.push({x:e.x+rnd(-30,30),y:e.y+rnd(-30,30),m:false});
      chests.push({x:e.x,y:e.y,m:false,t:0});
      texts.push({x:e.x,y:e.y-40,v:'RƯƠNG BOSS!',t:2,c:true,big:true});
      shake=12;
      fx.push({x:e.x,y:e.y,ring:80,t:.6,T:.6,c:'#ffd700'});
    }
    if(Math.random()<.05)coinsArr.push({x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),m:false});
    for(let i=0;i<6;i++)fx.push({x:e.x,y:e.y,vx:rnd(-90,90),vy:rnd(-90,90),t:.35,c:'#6fbf2a',r:2.5});
  }
}
function nearest(n,range){
  const arr=[];
  for(const e of enemies){
    if(e.dead)continue;
    const d=Math.hypot(e.x-P.x,e.y-P.y);
    if(d<range)arr.push([d,e]);
  }
  arr.sort((a,b)=>a[0]-b[0]);
  return arr.slice(0,n).map(a=>a[1]);
}
const at=(a,l)=>a[Math.min(l,a.length)-1];
function fireWeapons(dt){
  for(const k in lv){
    cd[k]-=dt;
    if(k==='lightning'&&lv[k]>=6&&clouds.length>0)cd[k]=2.5;
    if(cd[k]>0)continue;
    const l=lv[k];
    if(k==='kunai'&&l>=6){cd[k]=1;continue;}
    if(k==='rocket'&&l>=6){
      const vis=enemies.filter(e=>!e.dead&&Math.abs(e.x-P.x)<W/zoom/2&&Math.abs(e.y-P.y)<H/zoom/2);
      for(let i=0;i<5;i++){
        let tx,ty;
        if(vis.length){const t=vis[Math.floor(Math.random()*vis.length)];tx=t.x+rnd(-18,18);ty=t.y+rnd(-18,18);}
        else{tx=P.x+rnd(-150,150);ty=P.y+rnd(-200,200);}
        const sy=Math.min(ty-320,P.y-H/zoom/2-120);
        projs.push({k,sky:true,x:tx,y:sy,tx,ty,vx:0,vy:850,a:Math.PI/2,dmg:700,rad:105,big:4,delay:i*.14,life:6,r:8,hit:new Set()});
      }
      cd[k]=4;continue;
    }
    if(k==='lightning'&&l>=6){
      for(let i=0;i<4;i++){const a=i*Math.PI/2+rnd(0,.5);
        clouds.push({x:P.x+Math.cos(a)*70,y:P.y+Math.sin(a)*70,life:10,T:10,zt:rnd(0,.25),ph:rnd(0,6),flash:0});}
      cd[k]=2.5;continue;
    }
    if(k==='ringz'&&l>=6){cd[k]=1;continue;}
    if(k==='ringz'){
      rings.push({r:0,ph:0,hit:new Set(),maxR:110+12*l,dmg:25+9*l});

        projs.push({k,x:P.x,y:P.y,vx:0,vy:0,a:0,dmg:135,chain:true,ph:0,tgt:tg[i%tg.length],left:15,hit:new Set(),r:24,big:2.3,life:9});

      cd[k]=2.2;continue;
    }
    if(k==='kunai'){

        const a=base+(i-(n-1)/2)*.18;
        projs.push({k,x:P.x,y:P.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,a,dmg:12+4*l,pierce:l>=4?2:1,hit:new Set(),life:1,r:6});
      }
      cd[k]=.85-.06*l;
    }
    if(k==='rocket'){
      const tg=nearest(3,420);
      if(!tg.length){cd[k]=.1;continue;}
      const n=at([1,1,2,2,3],l);
      for(let i=0;i<n;i++){
        const t=tg[i%tg.length];

        for(const e of enemies){
          if(e.dead)continue;

function explode(p){
  for(const e of enemies){
    if(e.dead)continue;
    if(Math.hypot(e.x-p.x,e.y-p.y)<p.rad+e.r)hitEnemy(e,p.dmg,e.x-p.x,e.y-p.y);
  }
  fx.push({x:p.x,y:p.y,ring:p.rad,t:.3,T:.3,c:'#ffb340'});
  for(let i=0;i<10;i++)fx.push({x:p.x,y:p.y,vx:rnd(-140,140),vy:rnd(-140,140),t:.4,c:'#ff9a2b',r:3});
  shake=Math.max(shake,3);
}
function updateProjs(dt){
  for(const p of projs){
    if(p.dead)continue;
    p.life-=dt;
    if(p.sky){
      if(p.delay>0){p.delay-=dt;continue;}
      p.y+=p.vy*dt;
      if(p.y>=p.ty){p.y=p.ty;explode(p);p.dead=true;}
      continue;
    }
    if(p.chain){
      p.ph+=dt*10;
      if(!p.tgt||p.tgt.dead||p.left<=0){p.dead=true;continue;}
      const d=Math.hypot(p.tgt.x-p.x,p.tgt.y-p.y);
      if(d<20){
        hitEnemy(p.tgt,p.dmg,p.tgt.x-p.x,p.tgt.y-p.y);
        p.hit.add(p.tgt);p.left--;
        let best=null,bd=200;
        for(const e of enemies){if(e.dead||p.hit.has(e))continue;const dd=Math.hypot(e.x-p.tgt.x,e.y-p.tgt.y);if(dd<bd){bd=dd;best=e;}}
        p.tgt=best;if(!best)p.dead=true;
      }else{
        p.x+=(p.tgt.x-p.x)/d*500*dt;p.y+=(p.tgt.y-p.y)/d*500*dt;
      }
      continue;
    }
    if(p.k==='boomerang'&&!p.chain){
      p.pt+=dt;p.a+=dt*12;
      if(p.pt<1){p.x+=p.vx*dt;p.y+=p.vy*dt;}
      else{
        const dx=P.x-p.x,dy=P.y-p.y,d=Math.hypot(dx,dy)||1;
        p.x+=dx/d*400*dt;p.y+=dy/d*400*dt;
        if(d<18)p.dead=true;
      }
    }else{
      if(p.tgt&&!p.tgt.dead){
        const a=Math.atan2(p.tgt.y-p.y,p.tgt.x-p.x),cur=Math.atan2(p.vy,p.vx);
        let diff=a-cur;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
        const na=cur+diff*3*dt;
        const sp=Math.hypot(p.vx,p.vy);
        p.vx=Math.cos(na)*sp;p.vy=Math.sin(na)*sp;p.a=na;
      }
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.a!==undefined&&p.k!=='boomerang')p.a=Math.atan2(p.vy,p.vx);
    }
    if(p.life<=0){if(p.k==='rocket')explode(p);p.dead=true;continue;}
    if(p.earth){
      for(const e of enemies){
        if(e.dead||p.hit.has(e))continue;
        // khi đánh boss vẫn gây dame cho quái xung quanh
        if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r+8){
          p.hit.add(e);
          let dmg = p.dmg + (lv.golem>=6 ? e.max*0.03 : 0);
          hitEnemy(e,dmg,p.vx,p.vy);
          if(lv.golem>=6) fx.push({x:e.x,y:e.y,t:.3,c:'#ff2222',r:3});
          const dist=Math.hypot(e.x-p.x,e.y-p.y)||1;
          e.kx+= (e.x-p.x)/dist*180;
          e.ky+= (e.y-p.y)/dist*180;
          e.rooted=Math.max(e.rooted||0,0.4);
        }
      }
      if(Math.random()<0.3) fx.push({x:p.x,y:p.y,vx:rnd(-10,10),vy:rnd(-10,10),t:.5,c:lv.golem>=6?'#ff4444':'#8b6a3a',r:4});
      continue;
    }
    if(p.k==='tuocdoat'){
      // Trảo tử thần - bay tới mục tiêu, chạm là chết luôn kể cả boss và bot
      if(Math.random()<0.6) fx.push({x:p.x,y:p.y,vx:rnd(-20,20),vy:rnd(-20,20),t:.45,c:'#000',r:rnd(2,5)});
      fx.push({x:p.x,y:p.y,vx:rnd(-10,10),vy:rnd(-10,10),t:.35,c:'#ff0000',r:2.5});
      // vệt đen
      for(const e of enemies){
        if(e.dead||p.hit.has(e))continue;
        if(Math.hypot(e.x-p.x,e.y-p.y) < e.r + p.r + 12){
          p.hit.add(e);
          if(!e.dead){
            e.hp=0; e.dead=true; kills++;
            gems.push({x:e.x,y:e.y,v:(e.t==='b'?50:e.t==='t'?4:1)*(T<90?3:1),m:false});
            if(e.t==='b'){
              for(let i=0;i<12;i++)coinsArr.push({x:e.x+rnd(-30,30),y:e.y+rnd(-30,30),m:false});
              chests.push({x:e.x,y:e.y,m:false,t:0});
              texts.push({x:e.x,y:e.y-40,v:'BOSS BỊ TƯỚC ĐOẠT!',t:2,c:true,big:true});
              shake=14;
              fx.push({x:e.x,y:e.y,ring:90,t:.7,T:.7,c:'#000'});
            }else{
              texts.push({x:e.x,y:e.y-24,v:'TƯỚC ĐOẠT!',t:1,c:true});
            }
            fx.push({x:e.x,y:e.y,ring:55,t:.6,T:.6,c:'#ff0000'});
            fx.push({x:e.x,y:e.y,ring:35,t:.5,T:.5,c:'#000'});
            for(let i=0;i<10;i++) fx.push({x:e.x,y:e.y,vx:rnd(-150,150),vy:rnd(-150,150),t:.6,c:'#111',r:rnd(3,6)});
            if(Math.random()<.05)coinsArr.push({x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),m:false});
          }
        }
      }
      // nếu chạm mục tiêu chính thì xóa
      if(p.tgt && p.tgt.dead){ p.dead=true; fx.push({x:p.x,y:p.y,ring:70,t:.6,T:.6,c:'#000'}); }
      continue;
    }
    for(const e of enemies){
      if(e.dead||p.hit.has(e))continue;
      if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r){
        if(p.k==='rocket'){explode(p);p.dead=true;break;}
        p.hit.add(e);
        hitEnemy(e,p.dmg,p.vx,p.vy);
        if(p.pierce!==undefined){p.pierce--;if(p.pierce<=0){p.dead=true;break;}}
      }
    }
  }
  projs=projs.filter(p=>!p.dead);
}

      }
      // update fx timers an toàn trong update, không để trong render
      golemAttackFx=Math.max(0,golemAttackFx-dt);
      golemRootFx=Math.max(0,golemRootFx-dt);
      golemSt.walk+=dt*(golemSt.moving?6:1.2);
    }
  }
  rings=rings.filter(g=>!g.dead);
  for(const c of clouds){
    c.life-=dt;c.ph+=dt;c.zt-=dt;c.flash=Math.max(0,c.flash-dt);
    let best=null,bd=1e9;
    for(const e of enemies){if(e.dead)continue;const d=Math.hypot(e.x-c.x,e.y-c.y);if(d<bd){bd=d;best=e;}}
    if(best&&bd>35){c.x+=(best.x-c.x)/bd*95*dt;c.y+=(best.y-c.y)/bd*95*dt;}
    if(c.zt<=0&&best&&bd<170){
      c.zt=.25;c.flash=.12;
      const used=new Set(),pts=[{x:c.x,y:c.y+8}];
      let cur=best;
      for(let n=0;n<10&&cur;n++){
        used.add(cur);pts.push({x:cur.x,y:cur.y});
        hitEnemy(cur,56,cur.x-c.x,cur.y-c.y);
        let nx=null,nd=120;
        for(const e of enemies){
          if(e.dead||used.has(e))continue;
          const d=Math.hypot(e.x-cur.x,e.y-cur.y);
          if(d<nd){nd=d;nx=e;}
        }
        cur=nx;
      }
      arcs.push({pts,t:.15});
    }
  }
  clouds=clouds.filter(c=>c.life>0);
  // --- Hố Đen - AN TOÀN: chỉ gây dame lên quái, không bao giờ trừ máu người chơi ---
  for(const bh of blackholes){
    bh.life-=dt; bh.ph+=dt*2; bh.tick-=dt;
    for(const e of enemies){
      if(e.dead) continue;
      const d=Math.hypot(e.x-bh.x,e.y-bh.y);
      if(d < bh.pullRad + e.r){
        const force = (bh.isEvo ? 180 : 110) * dt * (1 - d/bh.pullRad);
        e.x += (bh.x - e.x)/d * force;
        e.y += (bh.y - e.y)/d * force;
        e.inBH = 0.8;
      }
    }
    if(bh.tick<=0){
      bh.tick=0.3;
      for(const e of enemies){
        if(e.dead) continue;
        if(Math.hypot(e.x-bh.x,e.y-bh.y) < bh.rad + e.r){
          const extra = bh.isEvo ? e.max*0.03 : 0;
          const totalDmg = bh.dmg + extra;
          hitEnemy(e, totalDmg, bh.x-e.x, bh.y-e.y);
          bh.total+=totalDmg;
          e.inBH = 1.0;
          if(bh.isEvo && extra>0) texts.push({x:e.x,y:e.y-18,v:'-3% HP',t:.5,c:true});
        }
      }
      fx.push({x:bh.x,y:bh.y,ring:bh.rad,t:.25,T:.25,c:'#7a00ff'});
    }
    if(bh.life<=0){
      bh.dead=true;
      if(bh.isEvo){
        const explDmg = bh.total*3;
        for(const e of enemies){
          if(e.dead) continue;
          if(Math.hypot(e.x-bh.x,e.y-bh.y) < bh.pullRad*0.8 + e.r){
            const extraExpl = e.max*0.03;
            hitEnemy(e, explDmg + extraExpl, e.x-bh.x, e.y-bh.y);
            if(Math.random()<0.2 && !e.dead){ gems.push({x:e.x,y:e.y,v:2,m:false}); }
          }
        }
        fx.push({x:bh.x,y:bh.y,ring:bh.pullRad,t:.6,T:.6,c:'#000'});
        fx.push({x:bh.x,y:bh.y,ring:bh.pullRad*0.6,t:.5,T:.5,c:'#b86bff'});
        texts.push({x:bh.x,y:bh.y-30,v:'NỔ HỐ ĐEN! '+Math.round(explDmg),t:1.2,c:true,big:true});
        shake=Math.max(shake,8);
      }else{
        fx.push({x:bh.x,y:bh.y,ring:bh.rad,t:.4,T:.4,c:'#7a00ff'});
      }
    }
  }
  blackholes=blackholes.filter(b=>!b.dead);
  for(const w of warns){
    w.t-=dt;
    if(w.t<=0){
      w.dead=true;shake=7;
      if(Math.hypot(P.x-w.x,P.y-w.y)<w.r){P.hp-=Math.min(w.dmg||35,P.maxhp*(w.cap||.65));P.hurt=.35; shake=Math.max(shake,8);}
      fx.push({x:w.x,y:w.y,ring:w.r,t:.35,T:.35,c:'#ff5040'});
    }
  }
  warns=warns.filter(w=>!w.dead);
  for(const a of arcs)a.t-=dt;
  arcs=arcs.filter(a=>a.t>0);
  const grid=new Map();
  for(const e of enemies){
    const k=Math.floor(e.x/22)+','+Math.floor(e.y/22);
    let a=grid.get(k);if(!a){a=[];grid.set(k,a);}a.push(e);
  }
  for(const e of enemies){
    if(e.dead)continue;
    if(e.rooted>0){ e.rooted-=dt; continue; }
    const d=Math.hypot(P.x-e.x,P.y-e.y)||1;
    const chase=e.t==='r'?(d>190?1:d<140?-.8:0):(e.t==='b'&&e.bt==='r')?(d>300?1:d<220?-.9:0):1;
    let vx=(P.x-e.x)/d*e.sp*chase+e.kx,vy=(P.y-e.y)/d*e.sp*chase+e.ky;
    if(e.t==='r'){e.sh-=dt;if(e.sh<=0&&d<340){e.sh=6.6+rnd(0,1.8);eprojs.push({x:e.x,y:e.y,vx:(P.x-e.x)/d*190,vy:(P.y-e.y)/d*190,dmg:e.dmg,life:3,r:5,c:'acid'});}} // giảm tốc đánh 2 lần
    e.kx*=Math.pow(.001,dt);e.ky*=Math.pow(.001,dt);
    const cx=Math.floor(e.x/22),cy=Math.floor(e.y/22);
    for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
      const a=grid.get((cx+i)+','+(cy+j));if(!a)continue;
      for(const o of a){
        if(o===e)continue;
        const ox=e.x-o.x,oy=e.y-o.y,od=Math.hypot(ox,oy);
        const mn=(e.r+o.r)*.9;
        if(od>0&&od<mn){vx+=ox/od*30;vy+=oy/od*30;}
      }
    }
    if(e.t==='b'){bossAI(e,dt);if(e.cw>0){vx=0;vy=0;}else if(e.dash>0){vx=e.dx*430;vy=e.dy*430;}}
    e.x+=vx*dt;e.y+=vy*dt;
    e.flash=Math.max(0,e.flash-dt);
    // FIX hố đen: quái trong hố đen không gây dame chạm
    if(d<e.r+9){
      if(e.t==='b'){
        P.hp-=Math.min(e.dmg*1.8, P.maxhp*0.65)*dt*2.5; P.hurt=.25;
      }else{
        if((e.inBH||0)<=0){
          P.hp-=Math.min(e.dmg*1.2,P.maxhp*.2)*dt;P.hurt=.12;
        }
      }
    }
    if(e.inBH) e.inBH=Math.max(0,e.inBH-dt);
    if(d>Math.max(W,H)/zoom){const a=rnd(0,Math.PI*2),r=Math.max(W,H)/zoom/2*1.05+30;e.x=P.x+Math.cos(a)*r;e.y=P.y+Math.sin(a)*r;}
  }
  for(const b of eprojs){
    b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(Math.hypot(P.x-b.x,P.y-b.y)<b.r+9){
      if(b.redOrb){
        P.hp-=P.maxhp*0.25;
        P.hurt=.35; shake=Math.max(shake,6);
        fx.push({x:P.x,y:P.y,ring:35,t:.4,T:.4,c:'#ff0000'});
        texts.push({x:P.x,y:P.y-20,v:'-25% HP!',t:.8,c:true});
        b.dead=true;
      }else if((P.inv||0)<=0){
        P.hp-=Math.min(b.dmg,P.maxhp*.15);P.inv=.4;P.hurt=.15;b.dead=true;shake=Math.max(shake,2);
      }
    }
    if(b.life<=0)b.dead=true;
  }
  eprojs=eprojs.filter(b=>!b.dead);
  enemies=enemies.filter(e=>!e.dead);
  const mag=60+40*ps.mag;
  for(const g of gems){
    const d=Math.hypot(P.x-g.x,P.y-g.y);
    if(d<mag)g.m=true;
    if(g.m){const s=260+ (g.t=(g.t||0)+dt)*500;g.x+=(P.x-g.x)/d*s*dt;g.y+=(P.y-g.y)/d*s*dt;}
    if(d<12){g.dead=true;gainXp(g.v);}
  }
  gems=gems.filter(g=>!g.dead);
  if(gems.length>500)gems.splice(0,gems.length-500);
  for(const c of coinsArr){
    const d=Math.hypot(P.x-c.x,P.y-c.y);
    if(d<mag)c.m=true;
    if(c.m){c.x+=(P.x-c.x)/d*320*dt;c.y+=(P.y-c.y)/d*320*dt;}
    if(d<12){c.dead=true;coins++;}
  }
  coinsArr=coinsArr.filter(c=>!c.dead);
  // nam châm hút exp - spawn mỗi 25-35s trên đường đi
  magnetT-=dt;
  if(magnetT<=0){
    magnetT=25+rnd(0,10);
    const a=rnd(0,Math.PI*2), r=rnd(120,220);
    magnets.push({x:P.x+Math.cos(a)*r, y:P.y+Math.sin(a)*r, t:0, life:18});
    texts.push({x:P.x,y:P.y-50,v:'Nam châm xuất hiện!',t:1.2,c:true});
  }
  for(const m of magnets){
    m.t+=dt; m.life-=dt;
    const d=Math.hypot(P.x-m.x,P.y-m.y);
    if(d<22){
      m.dead=true;
      // hút tất cả exp trên map
      for(const g of gems){ g.m=true; g.t=0; }
      for(const c of coinsArr){ c.m=true; }
      texts.push({x:P.x,y:P.y-40,v:'HÚT HẾT EXP!',t:1.5,c:true,big:true});
      fx.push({x:P.x,y:P.y,ring:120,t:.5,T:.5,c:'#00e5ff'});
      fx.push({x:P.x,y:P.y,ring:180,t:.7,T:.7,c:'#00e5ff'});
      shake=Math.max(shake,4);
      // hút thêm 20% nam châm
      ps.mag = Math.min(5, ps.mag+0.2);
    }
    if(m.life<=0) m.dead=true;
  }
  magnets=magnets.filter(m=>!m.dead);

  for(const ch of chests){
    const d=Math.hypot(P.x-ch.x,P.y-ch.y);
    if(d<60+40*ps.mag) ch.m=true;
    if(ch.m){ const s=200+ (ch.t=(ch.t||0)+dt)*400; ch.x+=(P.x-ch.x)/d*s*dt; ch.y+=(P.y-ch.y)/d*s*dt; }
    if(d<18){
      ch.dead=true;
      const heal = P.maxhp*0.75;
      P.hp=Math.min(P.maxhp, P.hp+heal);
      texts.push({x:P.x,y:P.y-30,v:'+75% HP & 2 thẻ!',t:1.5,heal:true,big:true});
      fx.push({x:P.x,y:P.y,ring:60,t:.6,T:.6,c:'#ffd700'});
      bonusPicks=2;
      openLevelUp();
    }
  }
  chests=chests.filter(ch=>!ch.dead);
  for(const f of fx){f.t-=dt;if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;}}
  fx=fx.filter(f=>f.t>0);
  for(const t of texts){t.t-=dt;t.y-=30*dt;}
  texts=texts.filter(t=>t.t>0);
  for(const b of bolts)b.t-=dt;
  bolts=bolts.filter(b=>b.t>0);
  shake=Math.max(0,shake-dt*12);
  updateHud();
  if(P.hp<=0)gameOver();
}
function gameOver(){
  state='over';
  $('rTime').textContent='⏱ Thời gian sống sót: '+fmt(T);
  $('rKills').textContent='💀 Zombie đã diệt: '+kills;
  $('rLvl').textContent='⭐ Cấp độ: '+P.lvl;
  $('rCoins').textContent='🪙 Xu thu được: '+coins;
  show('over',true);
}
const CELL=40,BLOCK=20;
function isRoadX(ix){const m=((ix%BLOCK)+BLOCK)%BLOCK;return m<4;}
function drawBg(cx,cy,vw,vh){
  const x0=Math.floor((cx-vw/2)/CELL)-1,x1=Math.ceil((cx+vw/2)/CELL)+1;
  const y0=Math.floor((cy-vh/2)/CELL)-1,y1=Math.ceil((cy+vh/2)/CELL)+1;
  for(let iy=y0;iy<=y1;iy++)for(let ix=x0;ix<=x1;ix++){
    const rx=isRoadX(ix),ry=isRoadX(iy);
    const x=ix*CELL,y=iy*CELL;
    if(rx||ry){
      ctx.fillStyle='#6a6a93';ctx.fillRect(x,y,CELL,CELL);
      ctx.fillStyle='#e9e9f2';
      if(ry&&!rx){const m=((iy%BLOCK)+BLOCK)%BLOCK; if(m===1||m===2){ if(ix%2===0)ctx.fillRect(x+6,y+CELL/2-3+(m===1?10:-10),CELL-12,6);} }
      if(rx&&!ry){const m=((ix%BLOCK)+BLOCK)%BLOCK; if(m===1||m===2){ if(iy%2===0)ctx.fillRect(x+CELL/2-3+(m===1?10:-10),y+6,6,CELL-12);} }
    }else{
      ctx.fillStyle=((ix+iy)&1)?'#c9c9d6':'#c3c3d1';ctx.fillRect(x,y,CELL,CELL);
      ctx.strokeStyle='#9c9cb2';ctx.lineWidth=1.5;ctx.strokeRect(x,y,CELL,CELL);
    }
  }
}
function drawZombie(e){

  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(0,9,8,3,0,0,7);ctx.fill();

  ctx.fillStyle=fl?'#fff':'#5f4130';ctx.fillRect(-5,8,4,3);ctx.fillRect(1,8,4,3);
  ctx.fillStyle=fl?'#fff':'#7fcf6a';ctx.beginPath();ctx.roundRect(-8,-11,16,13,3);ctx.fill();
  ctx.strokeStyle=fl?'#fff':'#3e7a33';ctx.lineWidth=1;ctx.stroke();
  if(!fl){
    ctx.fillStyle='#1b2a16';ctx.fillRect(-5,-6,3,3);ctx.fillRect(2,-6,3,3);

      if(e.revived){ ctx.fillStyle='#7ff'; ctx.fillRect(-3,-9,6,2); }
      if(e.rooted>0){ ctx.strokeStyle='#4a8a3a';ctx.lineWidth=1;ctx.strokeRect(-7,-12,14,15); }
    }
    ctx.fillStyle='#7fcf6a';ctx.fillRect(7,0,5,3);
    if(e.t==='b'&&e.bt==='r'){
      ctx.fillStyle='#5b2aa8';ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(0,-31);ctx.lineTo(10,-10);ctx.fill();
      ctx.fillStyle='#ffd23a';ctx.fillRect(-10,-12,20,3);
      ctx.fillStyle='#b24bff';ctx.fillRect(-5,-6,3,3);ctx.fillRect(2,-6,3,3);
      ctx.fillStyle='#8a5a2b';ctx.fillRect(11,-6,2,22);
      ctx.fillStyle='#d28bff';ctx.beginPath();ctx.arc(12,-8,4,0,7);ctx.fill();
    }
    if(e.t==='b'&&e.bt!=='r'){
      ctx.fillStyle='#e8e0c8';
      ctx.beginPath();ctx.moveTo(-8,-9);ctx.lineTo(-12,-19);ctx.lineTo(-3,-11);ctx.fill();
      ctx.beginPath();ctx.moveTo(8,-9);ctx.lineTo(12,-19);ctx.lineTo(3,-11);ctx.fill();
      ctx.fillStyle='#ff2a2a';ctx.fillRect(-5,-6,3,3);ctx.fillRect(2,-6,3,3);
      ctx.fillStyle='#fff';ctx.fillRect(-3,4,1.5,3);ctx.fillRect(1.5,4,1.5,3);
    }
  }
  ctx.restore();
  if(e.t==='b'){const w=56,y=e.y-e.r-34;
    ctx.fillStyle='#000c';ctx.fillRect(e.x-w/2-1,y-1,w+2,7);ctx.fillStyle='#e22';ctx.fillRect(e.x-w/2,y,w*Math.max(0,e.hp)/e.max,5);}
  else if(e.t==='t'&&e.hp<e.max){ctx.fillStyle='#000a';ctx.fillRect(e.x-10,e.y-24,20,3);ctx.fillStyle='#e44';ctx.fillRect(e.x-10,e.y-24,20*e.hp/e.max,3);}
}

  }

}

  if(golemSt && golemSt.active){

    ctx.translate(golemSt.x, golemSt.y+bob);
    ctx.fillStyle='rgba(0,0,0,.32)';ctx.beginPath();ctx.ellipse(0,40,32,11,0,0,7);ctx.fill();
    
    const w = isEvo? 88 : 74;
    const h = isEvo? 96 : 82;
    
    // animation cúi đập - làm cho liền mạch
    const attackProg = golemAttackFx>0 ? (0.35-golemAttackFx)/0.35 : 0;
    const slam = attackProg>0 ? Math.sin(attackProg*Math.PI) : 0; // 0->1->0
    const bend = slam*0.75; // góc cúi
    const down = slam*22; // hạ thân xuống
    const legBrace = slam*0.25; // chân khuỵu khi cúi
    
    // ---- CHÂN - gắn liền với thân, không tách ----
    for(let side of [-1,1]){
      ctx.save();
      // hông - điểm gắn cố định trên thân, không tách
      ctx.translate(side*13, 20);
      // khi cúi, chân hơi khuỵu ra sau để trụ
      ctx.rotate((moving?Math.sin(walk+side*0.5)*0.35:Math.sin(walk*0.3+side)*0.12) - legBrace*side*0.3);
      // đùi - to và gắn liền
      ctx.fillStyle='#4a3522'; ctx.strokeStyle='#1a120a'; ctx.lineWidth=3;
      ctx.beginPath(); 
      ctx.moveTo(-8,-12); ctx.lineTo(8,-12); ctx.lineTo(7,14); ctx.lineTo(-7,14); ctx.closePath();
      ctx.fill(); ctx.stroke();
      // vân gỗ đùi
      ctx.strokeStyle='rgba(20,10,5,0.3)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-4,-4); ctx.lineTo(4,4); ctx.stroke();
      // cẳng chân - gắn liền ở đầu gối, không tách
      ctx.translate(0,14);
      ctx.rotate((moving?Math.sin(walk+side*0.5+1)*0.5:0) + legBrace*0.6);
      ctx.fillStyle='#5a412e'; ctx.strokeStyle='#1a120a'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.roundRect(-7,-2,14,22,6); ctx.fill(); ctx.stroke();
      // bàn chân to bè, gắn liền
      ctx.fillStyle='#2a1e12'; ctx.beginPath(); ctx.ellipse(0,20,12,6,0,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#3d6b2a'; ctx.beginPath(); ctx.ellipse(0,20,8,3,0,0,7); ctx.fill();
      ctx.restore();
    }
    
    // ---- THÂN + ĐẦU - cúi nguyên khối, không tách ----
    ctx.save();
    ctx.translate(0, down*0.4);

    // thân chính - 1 khối liền, không tách rời
    const grad = ctx.createLinearGradient(-w*0.3,0,w*0.3,0);
    grad.addColorStop(0,'#2f1e12'); grad.addColorStop(0.5,'#6b4a2e'); grad.addColorStop(1,'#2f1e12');
    ctx.fillStyle=grad; ctx.strokeStyle='#0f0a06'; ctx.lineWidth=3;
    ctx.beginPath(); 
    // vẽ thân liền mạch bo tròn
    ctx.moveTo(-w*0.32,-h*0.42);
    ctx.quadraticCurveTo(-w*0.36,-h*0.1, -w*0.28, h*0.18);
    ctx.quadraticCurveTo(0, h*0.22, w*0.28, h*0.18);
    ctx.quadraticCurveTo(w*0.36,-h*0.1, w*0.32,-h*0.42);
    ctx.quadraticCurveTo(0,-h*0.5, -w*0.32,-h*0.42);
    ctx.fill(); ctx.stroke();
    // vân gỗ dọc thân - tạo cảm giác vỏ cây

    for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*8, -h*0.38); ctx.quadraticCurveTo(i*8+rnd(-3,3), -h*0.05, i*7, h*0.15); ctx.stroke(); }
    // rêu vai - gắn liền

    ctx.beginPath(); ctx.arc(w*0.32,-h*0.32,11,0,7); ctx.fill();
    ctx.fillStyle='#6fbf4a'; ctx.beginPath(); ctx.arc(-w*0.32,-h*0.32,6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(w*0.32,-h*0.32,6,0,7); ctx.fill();

    ctx.beginPath(); ctx.arc(w*0.34,-h*0.24,8,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(w*0.18,-h*0.12,4.5,0,7); ctx.fill();
    ctx.shadowBlur=0;
    // rune ngực phát sáng
    ctx.fillStyle=isEvo?'rgba(0,229,255,1)':'rgba(0,229,255,0.85)'; ctx.shadowColor='#00e5ff'; ctx.shadowBlur=isEvo?14:8;
    ctx.font='900 '+(isEvo?15:12)+'px Arial'; ctx.textAlign='center';
    ctx.fillText(isEvo?'ᛝ':'ᛟ',0,-h*0.02);
    ctx.shadowBlur=0;
    // đầu - gắn liền trên thân

    ctx.shadowBlur=0;
    // râu dây leo - gắn liền

    for(let i=0;i<4;i++){

    // tán lá trên đầu - chỉnh theo yêu cầu: ultimate tóc xanh thay vì đỏ
    if(isEvo){
      ctx.fillStyle='#1a3a6b'; ctx.beginPath(); ctx.ellipse(0,-h*0.78,22,14,0,0,7); ctx.fill();

    // ---- TAY - gắn liền ở vai, đập xuống đất ----

      let armRot = 0;
      if(attackProg>0){
        if(attackProg<0.35){
          // giơ tay lên cao chuẩn bị đập
          armRot = -1.2*side * (attackProg/0.35);
        }else{
          // đập xuống
          const downProg = (attackProg-0.35)/0.65;
          armRot = -1.2*side*(1-downProg) + 1.4*side*downProg;
        }
      }else{
        armRot = Math.sin(walk+side)*0.25*side;
      }
      ctx.rotate(armRot);
      
      // bắp tay - to, gắn liền vai
      ctx.fillStyle='#5a412e'; ctx.strokeStyle='#0f0a06'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.roundRect(-12,-6,24,38,9); ctx.fill(); ctx.stroke();
      // vân cơ bắp
      ctx.strokeStyle='rgba(15,10,6,0.25)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-6,6); ctx.lineTo(6,12); ctx.stroke();
      
      // cẳng tay - gắn liền ở khuỷu, không tách
      ctx.translate(0,32);
      ctx.rotate(attackProg>0 ? (attackProg<0.35? -0.3 : 0.9) : Math.sin(walk*1.2+side)*0.2);
      ctx.fillStyle='#6b4a2e'; ctx.strokeStyle='#0f0a06'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.roundRect(-10,-4,20,32,7); ctx.fill(); ctx.stroke();

      ctx.shadowBlur=0;
      
      // bàn tay nắm đấm - to, gắn liền

      ctx.rotate(attackProg>0 ? 0.2 : 0);
      ctx.fillStyle= attackProg>0.5 ? '#3d2a18' : '#4a3522';
      ctx.strokeStyle='#0f0a06'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.ellipse(0,8,16,13,0,0,7); ctx.fill(); ctx.stroke();
      // khi đập, nắm đấm phát sáng xanh lá
      if(attackProg>0.45){
        ctx.shadowColor='#7fff5a'; ctx.shadowBlur=16;
        ctx.fillStyle='#b4ff7a'; ctx.beginPath(); ctx.arc(0,8,7,0,7); ctx.fill();
        ctx.shadowBlur=0;
      }
      // rêu trên tay
      ctx.fillStyle='#4a8a3a'; ctx.beginPath(); ctx.arc(-8,2,4,0,7); ctx.fill();
      ctx.restore();
    }
    ctx.restore(); // hết thân cúi
    
    // ---- HIỆU ỨNG ĐẬP ĐẤT SINH ĐỘNG ----
    if(golemAttackFx>0 && attackProg>0.3){

        const alpha = (1-prog)*(0.85-k*0.18);

        ctx.strokeStyle='rgba('+(120-k*10)+','+(200-k*10)+',70,'+alpha+')';

      }
      // vòng sáng vàng trong cùng
      ctx.strokeStyle='rgba(255,240,150,'+(1-prog)*0.6+')'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,42, prog*240,0,7); ctx.stroke();
      // 10 vết nứt đất tỏa ra
      ctx.strokeStyle='rgba(70,45,15,'+(1-prog)*0.85+')'; ctx.lineWidth=3;
      ctx.lineCap='round';
      for(let i=0;i<10;i++){
        const ang = i/10*Math.PI*2 + rnd(-0.12,0.12);
        const len = prog*(110+rnd(0,30));
        const wobble = Math.sin(prog*8+i)*4;
        ctx.beginPath(); 
        ctx.moveTo(Math.cos(ang)*12 + wobble*0.3, 42+Math.sin(ang)*6);
        ctx.quadraticCurveTo(Math.cos(ang)*len*0.5 + wobble, 42+Math.sin(ang)*len*0.3, Math.cos(ang)*len, 42+Math.sin(ang)*len*0.35);
        ctx.stroke();
        // đá nhỏ văng ở đầu vết nứt
        if(prog<0.55){
          ctx.fillStyle='rgba(110,75,28,0.7)';
          ctx.beginPath(); ctx.arc(Math.cos(ang)*len*0.75+rnd(-4,4), 42+Math.sin(ang)*len*0.35+rnd(-4,4), rnd(2,4.5),0,7); ctx.fill();
        }
      }
      // bụi đất dày đặc khi đập
      if(prog<0.45){
        for(let i=0;i<8;i++){
          const a = rnd(0,Math.PI*2); const r = rnd(5, prog*60);
          ctx.fillStyle='rgba('+(120+rnd(-10,10))+','+(80+rnd(-10,10))+','+(30+rnd(-10,10))+','+(0.7-prog)+')';
          ctx.beginPath(); ctx.arc(Math.cos(a)*r + rnd(-6,6), 42+Math.sin(a)*r*0.5 + rnd(-8,8), rnd(3,8),0,7); ctx.fill();
        }
        // lá bay
        for(let i=0;i<5;i++){

        ctx.shadowColor='#7fff5a'; ctx.shadowBlur=8;

    ctx.restore();
  }

    ctx.translate(0,bob); ctx.scale(pulse,pulse);

    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,14,14,5,0,0,7); ctx.fill();

    ctx.fillStyle='#ff2222'; ctx.strokeStyle='#880000'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.roundRect(-14,-12,28,22,6); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#2222ff'; ctx.beginPath(); ctx.roundRect(-14,-12,14,22,6); ctx.fill(); ctx.stroke();

    ctx.fillStyle='#dddddd'; ctx.fillRect(-12,-14,10,4); ctx.fillRect(2,-14,10,4);

    ctx.setLineDash([4,4]);

    ctx.setLineDash([]);

    ctx.fillStyle='#fff'; ctx.font='900 9px Arial'; ctx.textAlign='center'; ctx.fillText('N',-7,-1); ctx.fillText('S',7,-1);
    // glow
    ctx.shadowColor='#00e5ff'; ctx.shadowBlur=12; ctx.fillStyle='rgba(0,229,255,0.3)'; ctx.beginPath(); ctx.arc(0,0,18,0,7); ctx.fill(); ctx.shadowBlur=0;
    // thời gian còn lại
    ctx.fillStyle='#fff'; ctx.font='700 8px Arial'; ctx.fillText(Math.ceil(m.life)+'s',0,22);
    ctx.restore();
  }
  for(const ch of chests){
    ctx.save();ctx.translate(ch.x,ch.y);
    const bob=Math.sin(T*4+ch.x)*2;
    ctx.translate(0,bob);
    ctx.fillStyle='#8b5a2b';ctx.strokeStyle='#ffd700';ctx.lineWidth=2;
    ctx.fillRect(-12,-8,24,16);ctx.strokeRect(-12,-8,24,16);
    ctx.fillStyle='#ffd700';ctx.fillRect(-12,-8,24,5);
    ctx.fillStyle='#fffa8a';ctx.fillRect(-2,-6,4,4);
    ctx.restore();
  }
  if(lv.kunai>=6){
    ctx.save();ctx.strokeStyle='rgba(230,240,255,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.x,P.y,kr.rad,0,7);ctx.stroke();ctx.restore();
    for(let i=0;i<32;i++){
      const a=kr.off+i*Math.PI/16;
      ctx.save();ctx.translate(P.x+Math.cos(a)*kr.rad,P.y+Math.sin(a)*kr.rad);
      ctx.rotate(a+(kr.out?Math.PI/2:-Math.PI/2));ctx.scale(1.25,1.25);
      ctx.fillStyle='#e8ecf5';ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(3.5,3);ctx.lineTo(-3.5,3);ctx.fill();
      ctx.fillStyle='#3b3f58';ctx.fillRect(-1.5,3,3,5);
      ctx.restore();
    }
  }
  if(lv.ringz>=6){
    ctx.save();
    const gr=ctx.createRadialGradient(P.x,P.y,AURA_R*.5,P.x,P.y,AURA_R);
    gr.addColorStop(0,'rgba(170,60,255,0)');gr.addColorStop(1,'rgba(170,60,255,.38)');

      ctx.strokeStyle=pass?'#f0d0ff':'#a63df0';ctx.lineWidth=pass?1.5:5;ctx.beginPath();

      ctx.stroke();
    }
    ctx.restore();

    drawProj(p);
  }
